name: P2 analyzer diagnose

on:
  push:
    branches:
      - automation/p2-confirmed-seek
    paths:
      - '.github/workflows/p2-analyzer-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p2-confirmed-seek
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - name: Checkout exact just_audio contract
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/p2-core"
          git clone --quiet https://github.com/Kyomorie/just_audio.git "$RUNNER_TEMP/p2-core"
          git -C "$RUNNER_TEMP/p2-core" checkout --quiet 37ad562a139c693ded726bbb6fd9f623f4579e70
          python - <<'PY'
          import os
          from pathlib import Path
          core = (Path(os.environ['RUNNER_TEMP']) / 'p2-core' / 'just_audio_platform_interface').as_posix()
          Path('dependency_overrides.yaml').write_text(
              'dependency_overrides:\n'
              '  just_audio_platform_interface:\n'
              f'    path: {core}\n'
          )
          PY
      - name: Apply exact candidate
        shell: bash
        run: |
          python .github/scripts/apply-p2-confirmed-seek.py
          dart format lib/src/mediakit_player.dart lib/src/set_property_io.dart lib/src/set_property_noop.dart
          flutter pub get
      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/p2-analyze.txt 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            cat /tmp/p2-analyze.txt
          } > .github/p2-analyze-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p2-analyze-output.txt
          git commit -m "ci: capture P2 analyzer diagnostics"
          git push origin HEAD:automation/p2-confirmed-seek
