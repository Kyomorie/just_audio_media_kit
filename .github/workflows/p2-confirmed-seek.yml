name: P2 confirmed seek

on:
  push:
    branches:
      - automation/p2-confirmed-seek
    paths:
      - '.github/workflows/p2-confirmed-seek.yml'

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p2-confirmed-seek
          fetch-depth: 0

      - name: Verify exact media-kit baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "d78b669b5521fc60f62fc28f39433bbff8a39699"
          test -z "$(git diff --name-only c1a5a15046ab565613c2d1e8736152aef9b6348c...HEAD | grep -v '^\.github/')"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Checkout exact just_audio contract
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/p2-core"
          git clone --quiet https://github.com/Kyomorie/just_audio.git "$RUNNER_TEMP/p2-core"
          git -C "$RUNNER_TEMP/p2-core" checkout --quiet 37ad562a139c693ded726bbb6fd9f623f4579e70
          python - <<'PY'
          import os
          from pathlib import Path
          core = (Path(os.environ['RUNNER_TEMP']) / 'p2-core' / 'just_audio_platform_interface').as_posix()
          Path('dependency_overrides.yaml').write_text(
              'dependency_overrides:\n'
              '  just_audio_platform_interface:\n'
              f'    path: {core}\n'
          )
          PY

      - name: Apply desktop confirmed seek
        shell: bash
        run: |
          python .github/scripts/apply-p2-confirmed-seek.py
          dart format lib/src/mediakit_player.dart lib/src/set_property_io.dart lib/src/set_property_noop.dart
          git diff --check
          changed="$(git diff --name-only | grep -v '^dependency_overrides.yaml$' | grep -v '^\.github/' | paste -sd, -)"
          test "$changed" = "lib/src/mediakit_player.dart,lib/src/set_property_io.dart,lib/src/set_property_noop.dart"

      - name: Analyze candidate
        shell: bash
        run: |
          flutter pub get
          flutter analyze

      - name: Create desktop smoke host
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then PLATFORM=windows; else PLATFORM=linux; fi
          flutter create --platforms="$PLATFORM" --org dev.kyomorie "$RUNNER_TEMP/p2-desktop-host"
          python - <<'PY'
          import os
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).as_posix()
          core = (Path(os.environ['RUNNER_TEMP']) / 'p2-core' / 'just_audio').as_posix()
          host = Path(os.environ['RUNNER_TEMP']) / 'p2-desktop-host'
          (host / 'pubspec.yaml').write_text(f'''name: p2_desktop_host
          publish_to: none
          environment:
            sdk: ">=3.1.3 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            just_audio:
              path: {core}
            just_audio_media_kit:
              path: {workspace}
          flutter:
            uses-material-design: true
          '''.replace('          ', ''))
          (host / 'lib' / 'main.dart').write_text('''import 'package:flutter/widgets.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_media_kit/just_audio_media_kit.dart';
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            JustAudioMediaKit.ensureInitialized();
            final player = AudioPlayer();
            player.seekConfirmed(const Duration(seconds: 1));
            runApp(const SizedBox.shrink());
          }
          '''.replace('          ', ''))
          PY

      - name: Build desktop smoke host
        shell: bash
        run: |
          cd "$RUNNER_TEMP/p2-desktop-host"
          flutter pub get
          if [[ "$RUNNER_OS" == "Windows" ]]; then flutter build windows --debug; else flutter build linux --debug; fi

  commit:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p2-confirmed-seek
          fetch-depth: 0
      - name: Verify validation source head
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "d78b669b5521fc60f62fc28f39433bbff8a39699"
          test -z "$(git diff --name-only c1a5a15046ab565613c2d1e8736152aef9b6348c...HEAD | grep -v '^\.github/')"
      - name: Apply exact validated source patch
        shell: bash
        run: |
          python3 .github/scripts/apply-p2-confirmed-seek.py
          git diff --check
          changed="$(git diff --name-only | grep -v '^\.github/' | paste -sd, -)"
          test "$changed" = "lib/src/mediakit_player.dart,lib/src/set_property_io.dart,lib/src/set_property_noop.dart"
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/mediakit_player.dart lib/src/set_property_io.dart lib/src/set_property_noop.dart
          git commit -m "feat: confirm seeks from fresh libmpv state"
          git push origin HEAD:automation/p2-confirmed-seek
